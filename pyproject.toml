[project]
name = "champions_sim"
version = "0.1.0"
description = "Deterministic Pokemon Champions singles battle simulator and AI research foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
champions-sim = "champions_sim.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
