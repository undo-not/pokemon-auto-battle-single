[project]
name = "champions_sim"
version = "0.2.0"
description = "Pinned Pokemon Showdown Champions integration and singles AI research foundation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
champions-sim = "champions_sim.cli:main"

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
