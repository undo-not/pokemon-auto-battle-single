name: バグ
description: 現行仕様に反する再現可能な動作を報告します。
title: "[バグ] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: observed
    attributes:
      label: 実際の動作
      description: 最小の再現入力と、正確なエラーまたは出力を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 根拠となる仕様、schema、不変条件、ADRを記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現方法
      description: 秘密情報や制限付きpayloadを除き、コマンド、seed、成果物identity、環境を記載してください。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響と証拠境界
      description: 影響範囲と、主張・データ・外部システムへの影響を記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 修正の受け入れ条件
      placeholder: "- [ ] 回帰テストで不具合を再現する\n- [ ] 修正が現行仕様を満たす"
    validations:
      required: true
