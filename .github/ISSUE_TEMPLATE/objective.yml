name: 目的
description: 一体として価値のある大きな成果を定義します。
title: "[目的] "
labels:
  - "type:objective"
body:
  - type: textarea
    id: outcome
    attributes:
      label: 成果
      description: 実装手順ではなく、観測可能な完了状態を記載してください。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 成果が必要な理由と、関連する仕様・ADRを記載してください。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: 含めるプロダクト・技術領域を記載してください。
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 対象外
      description: 含めない周辺作業と、許可しない外部作用を記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 観測可能な完了条件をチェックボックスで記載してください。
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 必要な証拠
      description: 必要なテスト、成果物、レビュー、外部検証を記載してください。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係と安全境界
      description: ブロッカー、権限、制限付きデータ、許可された外部操作を記載してください。
    validations:
      required: true
