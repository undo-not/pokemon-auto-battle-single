name: Decision
description: Resolve a durable technical choice and record it as an ADR.
title: "[Decision] "
labels:
  - "type:decision"
body:
  - type: textarea
    id: context
    attributes:
      label: Decision context
      description: Describe the forces, constraints, and why a decision is needed.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: List viable alternatives and meaningful tradeoffs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: State experiments, sources, reviews, or prototypes needed before deciding.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Resolution criteria
      placeholder: "- [ ] Decision is explicit\n- [ ] ADR records context, decision, and consequences"
    validations:
      required: true
