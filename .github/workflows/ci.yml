name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 検証 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.6", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Bootstrap pinned Showdown
        run: python scripts/bootstrap_showdown.py
      - name: Repository governance
        run: python scripts/check_repository_governance.py
      - name: Project Skills
        run: python scripts/validate_project_skills.py
      - name: Repository size
        run: python scripts/check_repo_size.py
      - name: Python syntax
        run: python -m compileall -q src scripts tests
      - name: Diff whitespace
        run: git diff --check
      - name: Tests
        run: python -m pytest -q
        env:
          SHOWDOWN_INTEGRATION: "1"
