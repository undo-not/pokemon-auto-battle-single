name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository governance
        run: python scripts/check_repository_governance.py
      - name: Project Skills
        run: python scripts/validate_project_skills.py
      - name: Repository size
        run: python scripts/check_repo_size.py
      - name: Local bundle
        run: python scripts/validate_sim01_bundle.py --usage-scope local_research
      - name: Frozen simulator baseline
        run: python scripts/validate_sim01_frozen.py
      - name: Tests
        run: python -m pytest -q
